name: CI

# Automates the "Verification Gate" documented in docs/project_status.md,
# which previously had to be run manually. Runs on every push/PR so a
# regression in the engine, adapters, backend, or frontend is caught before
# merge rather than discovered in production.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (engine + adapters + backend + cache)
    runs-on: ubuntu-latest
    env:
      ADAPTER_MODE: fixture
      FIXTURE_SCENARIO: normal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Architectural boundary check (engine must stay dependency-free)
        run: python check_boundaries.py

      - name: Run test suite
        run: python -m pytest engine/tests backend/tests adapters/tests cache/tests -v

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
